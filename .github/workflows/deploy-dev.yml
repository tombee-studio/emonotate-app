name: Deploy frontend to dev

run-name: Deploy frontend ${{ github.sha }} to dev

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

# Never run two frontend deploys to the same environment at once; queue them instead.
concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    secrets:
      aws_role_arn: ${{ secrets.AWS_CI_ROLE_ARN_DEV }}
